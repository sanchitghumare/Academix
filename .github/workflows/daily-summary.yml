name: Daily Summary Cron

on:
  schedule:
    - cron: "30 2 * * *" # Runs every day at 8:00am IST
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Call daily summary endpoint
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/daily-summary"